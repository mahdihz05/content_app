{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود</title>
    <link rel="stylesheet" href="{% static 'assets/styles/login_styles.css' %}">
    <!-- فونت های داخلی -->
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url("{% static 'fonts/Vazirmatn-Regular.woff2' %}") format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="form-title">ورود به حساب کاربری</h2>
            <p class="form-subtitle">خوش برگشتید!</p>
            <form id="login-form" method="post" action="{% url 'login-api-v1' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="phone_number">شماره تلفن</label>
                    <input type="text" id="phone_number" name="phone_number" required placeholder="شماره تلفن خود را وارد کنید">
                    <div class="input-border"></div>
                </div>
                <div class="form-group">
                    <label for="password">رمز عبور</label>
                    <input type="password" id="password" name="password" required placeholder="رمز عبور خود را وارد کنید">
                    <div class="input-border"></div>
                </div>

                <button type="submit" class="submit-button">ورود</button>

                <p class="switch-form-text">
                    حساب کاربری ندارید؟
                    <a href="{% url 'register' %}" class="switch-form-link">ثبت نام کنید</a>
                </p>
                <!-- اگر امکان بازیابی رمز عبور دارید، لینک آن را اینجا اضافه کنید -->
                <!-- <p class="forgot-password-text">
                    <a href="/forgot-password" class="forgot-password-link">فراموشی رمز عبور؟</a>
                </p> -->
            </form>
        </div>
        <div class="image-container">
            <!-- المان گرافیکی مدرن و مینیمال -->
            <svg class="modern-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8zm-1-13h2v6h-2V9zm0 8h2v2h-2v-2z" fill="currentColor"/>
            </svg>
            <h3 class="image-container-title">به سیستم خوش آمدید!</h3>
            <p class="image-container-subtitle">امنیت و سرعت را تجربه کنید.</p>
        </div>
    </div>

    <script src="{% static 'assets/scripts/login_scripts.js' %}"></script>
    <script>
document.getElementById("login-form").addEventListener("submit", async function (event) {

    event.preventDefault();

    const form = event.target;
    const button = form.querySelector("button[type='submit']");

    if (button) button.disabled = true;

    const formData = new FormData(form);

    const data = {};
    formData.forEach((value, key) => {
        data[key] = value;
    });

    try {

        const response = await fetch(form.action, {
            method: form.method,
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": formData.get("csrfmiddlewaretoken")
            },
            body: JSON.stringify(data)
        });

        let result;

        try {
            result = await response.json();
        } catch {
            throw new Error("پاسخ نامعتبر از سرور دریافت شد");
        }

        if (!response.ok) {
            throw result;
        }

        if (result.success) {

            // redirect از سمت سرور
            if (result.redirect) {
                window.location.href = result.redirect;
            } else {
                window.location.reload();
            }

        } else {

            alert(result.error || "خطا در ورود");

        }

    } catch (error) {

        console.error("Login Error:", error);

        let message = "خطا در ارتباط با سرور";

        if (error?.error) {
            message = error.error;
        }

        alert(message);

    } finally {

        if (button) button.disabled = false;

    }

});

    </script>
</body>
</html>
