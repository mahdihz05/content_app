services:

  # =====================================================
  # PostgreSQL
  # =====================================================

  db:
    image: postgres:16

    container_name: project_postgres

    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-project_db}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - project_network


  # =====================================================
  # Django Backend
  # =====================================================

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: project_web

    restart: always

    shm_size: "2gb"

    working_dir: /app

    env_file:
      - .env

    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-project_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver

      SELENIUM_HEADLESS: "true"

      PYTHONUNBUFFERED: "1"

    volumes:
      - ./backend/app:/app

    command: >
      sh -c "
        echo 'Waiting for postgres...';

        while ! nc -z db 5432;
        do
          sleep 1;
        done;

        echo 'Postgres started';

        python manage.py migrate --noinput;

        python manage.py collectstatic --noinput || true;

        python manage.py runserver 0.0.0.0:8000
      "

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - project_network


  # =====================================================
  # n8n
  # =====================================================

  n8n:
    image: n8nio/n8n:latest

    container_name: project_n8n

    restart: always

    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"

      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:?N8N_BASIC_AUTH_USER is required}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD is required}

      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"

      N8N_USER_FOLDER: /home/node/.n8n

      TZ: Asia/Tehran

    volumes:
      - n8n_data:/home/node/.n8n

    ports:
      - "5678:5678"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - project_network


  # =====================================================
  # NGINX
  # =====================================================

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    container_name: project_nginx

    restart: always

    depends_on:
      - web

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    ports:
      - "80:80"
      - "443:443"

    networks:
      - project_network


# =====================================================
# NETWORKS
# =====================================================

networks:
  project_network:
    driver: bridge


# =====================================================
# VOLUMES
# =====================================================

volumes:
  postgres_data:
  n8n_data:
