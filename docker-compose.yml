services:

  # =====================================================
  # PostgreSQL
  # =====================================================

  db:
    image: postgres:16

    container_name: project_postgres

    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
      POSTGRES_DB: ${POSTGRES_DB:-project_db}

    volumes:
      - ./volume/postgres:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - project_network

  # =====================================================
  # Django Backend
  # =====================================================

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: project_web

    restart: always

    # برای جلوگیری از crash شدن chromium
    shm_size: "2gb"

    env_file:
      - .env

    environment:

      # =====================================================
      # DATABASE
      # =====================================================

      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-project_db}
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}

      # =====================================================
      # SELENIUM / CHROME
      # =====================================================

      CHROME_BIN: /usr/bin/chromium

      CHROMEDRIVER_PATH: /usr/bin/chromedriver

      # true => headless
      # false => browser ui
      SELENIUM_HEADLESS: "true"

      PYTHONUNBUFFERED: "1"

    command: >
      sh -c "
        echo 'waiting for postgres...';

        while ! nc -z db 5432;
        do
          sleep 1;
        done;

        echo 'postgres started';

        python manage.py migrate --noinput;

        python manage.py runserver 0.0.0.0:8000
      "

    volumes:

      # پروژه جنگو
      - ./backend/app:/app

      # ذخیره دائمی پروفایل مرورگر
      - ./browser_profiles:/app/browser_profiles

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - project_network

  # =====================================================
  # n8n
  # =====================================================

  n8n:
    image: n8nio/n8n:latest

    container_name: project_n8n

    restart: always

    env_file:
      - .env

    environment:
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-adminpass}

    volumes:
      - ./n8n/data:/home/node/.n8n

    ports:
      - "5678:5678"

    networks:
      - project_network

  # =====================================================
  # NGINX
  # =====================================================

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    container_name: project_nginx

    restart: always

    depends_on:
      - web

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    ports:
      - "80:80"
      - "443:443"

    networks:
      - project_network

# =====================================================
# NETWORK
# =====================================================

networks:
  project_network:
    driver: bridge