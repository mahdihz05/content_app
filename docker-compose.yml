 
version: "3.9"

services:
  # ---------- PostgreSQL ----------
  db:
    image: postgres:16
    container_name: project_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin1234}
      POSTGRES_DB: ${POSTGRES_DB:-project_db}
    volumes:
      - ./volume/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ---------- Django Backend ----------
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - project_network

  # ---------- n8n ----------
  n8n:
    image: n8nio/n8n:latest
    container_name: project_n8n
    restart: always
    env_file:
      - .env
    environment:
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-adminpass}
      DB_TYPE: postgres
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-project_db}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-postgres}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-admin1234}
    volumes:
      - ./n8n/data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      - db
    networks:
      - project_network

  # ---------- Nginx ----------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: project_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - project_network

# ---------- شبکه داخلی ----------
networks:
  project_network:
    driver: bridge