name: Phase 0 baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  django-baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: content_app_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d content_app_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend/app
    env:
      POSTGRES_DB: content_app_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DJANGO_SECRET_KEY: ci-only-django-secret-with-more-than-fifty-distinct-characters-123456789
      DJANGO_DEBUG: "false"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "false"
      DJANGO_SECURE_HSTS_PRELOAD: "false"
      AI_API_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
      TELEGRAM_BOT_TOKEN: ci-placeholder
      RUN_BROWSER_SMOKE: "0"
      CHROME_BIN: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/app/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify browser dependency
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
      - name: Verify Django and migrations
        run: |
          python manage.py check
          DJANGO_SECURE_SSL_REDIRECT=true \
          DJANGO_SESSION_COOKIE_SECURE=true \
          DJANGO_CSRF_COOKIE_SECURE=true \
          DJANGO_SECURE_HSTS_SECONDS=31536000 \
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=true \
          DJANGO_SECURE_HSTS_PRELOAD=true \
          python manage.py check --deploy
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py showmigrations --plan
          python -m compileall -q .
      - name: Run characterization tests
        run: python manage.py test --noinput
      - name: Run browser smoke tests
        env:
          RUN_BROWSER_SMOKE: "1"
        run: python manage.py test dashboard.browser_tests --noinput
      - name: Verify Python dependencies
        run: python -m pip check
      - name: Verify baseline artifacts
        working-directory: .
        run: |
          python -m json.tool n8n/workflows/manifest.json > /dev/null
          python -m json.tool n8n/workflows/manifest.schema.json > /dev/null
          python -m json.tool n8n/workflows/archive/legacy-ai.v1.sanitized.json > /dev/null
          test -z "$(git ls-files '.env' 'n8n/data/**' 'volume/**' 'backend/app/messaging_automation___older/workers/profiles/**')"
          git diff --check
